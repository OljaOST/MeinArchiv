<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dokument hochladen – MeinArchiv</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <a href="{{ url_for('index') }}">Zurück zur Startseite</a>
    <main>
        <h1>Dokument hochladen</h1>
        <form action="{{ url_for('dokument_vorbereiten') }}" method="post" enctype="multipart/form-data">

            <input type="hidden" name="namensvorschlag" value="ja">
            <p>
                <label for="dokument">Datei auswählen</label>

                <input type="file" id="dokument" name="dokument" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" required>
            </p>

            <p>
                Mit «Dokument übernehmen» wird die Datei zur Ermittlung des Dateinamens an OpenAI gesendet.
            </p>

            <button type="submit">Dokument übernehmen</button>
        </form>
    </main>
</body>
</html>

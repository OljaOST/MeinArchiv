<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kategorien – MeinArchiv</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <a href="/">Zurück zur Startseite</a>

    <h1>Kategorien verwalten</h1>

    {% if kategorien %}
    <ul class="dokumentliste">
        {% for kategorie in kategorien %}
        <li class="dokumenteintrag">
            <div class="dokument-info">
                <strong>{{ kategorie.name }}</strong>
            </div>

            <div class="dokument-aktionen">
                <a href="{{ url_for('kategorie_bearbeiten',
                                            kategorie_id=kategorie.id) }}">
                    Umbenennen
                </a>

                <a href="{{ url_for('kategorie_loeschen',
                                            kategorie_id=kategorie.id) }}">
                    Löschen
                </a>
            </div>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>Es sind noch keine Kategorien vorhanden.</p>
    {% endif %}

    <h2>Neue Kategorie</h2>

    <form action="{{ url_for('kategorie_speichern') }}" method="post">
        <label for="name">Kategoriename</label>

        <input type="text" id="name" name="name" maxlength="60" placeholder="Zum Beispiel Rechnungen" required>

        <button type="submit">Kategorie hinzufügen</button>
    </form>
</body>

</html>

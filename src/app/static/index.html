<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MeinArchiv</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header class="app-header">
        <span class="app-logo" aria-hidden="true">▤</span>

        <div>
            <h1>MeinArchiv</h1>
            <p>Dokumente ablegen, finden und verwalten.</p>
        </div>
    </header>

    <main>
        <h2>Meine Dokumente</h2>

        <nav class="aktionen" aria-label="Dokumentaktionen">
            <a class="aktion-scannen" href="/scannen">
                <span class="aktionssymbol" aria-hidden="true">▣</span>
                <span class="aktionstitel">Scannen</span>
                <span class="aktionsbeschreibung">
                    Mit der Kamera erfassen
                </span>
            </a>

            <a class="aktion-hochladen" href="/hochladen">
                <span class="aktionssymbol" aria-hidden="true">↑</span>
                <span class="aktionstitel">Hochladen</span>
                <span class="aktionsbeschreibung">
                    Dokument auswählen
                </span>
            </a>

            <a class="aktion-einfuegen" href="/einfuegen">
                <span class="aktionssymbol" aria-hidden="true">▤</span>
                <span class="aktionstitel">Einfügen</span>
                <span class="aktionsbeschreibung">Dokument aus der Zwischenablage</span>
            </a>

            <a class="aktion-dokumente" href="/dokumente">
                <svg class="meinarchiv-symbol meinarchiv-symbol--ordner aktionssymbol ordner-gruen"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z"/>
                </svg>
                <span class="aktionstitel">Meine Dokumente</span>
                <span class="aktionsbeschreibung">
                    Gespeicherte Unterlagen verwalten
                </span>
            </a>
        </nav>

        <section class="kategorienbereich">
            <h2>Kategorien</h2>

            <a class="kategorienlink" href="/kategorien">
                Kategorien verwalten
                <span aria-hidden="true"> →</span>
            </a>
        </section>
    </main>
</body>

</html>

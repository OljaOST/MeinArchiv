<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MeinArchiv</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header class="app-header">
        <span class="app-logo" aria-hidden="true">▤</span>

        <div>
            <h1>MeinArchiv</h1>
            <p>Dokumente ablegen, finden und verwalten.</p>
        </div>
    </header>

    <main>
        <h2>Meine Dokumente</h2>

        <nav class="aktionen" aria-label="Dokumentaktionen">
            <a class="aktion-scannen" href="/scannen">
                <span class="aktionssymbol" aria-hidden="true">▣</span>
                <span class="aktionstitel">Scannen</span>
                <span class="aktionsbeschreibung">
                    Mit der Kamera erfassen
                </span>
            </a>

            <a class="aktion-hochladen" href="/dokumente#dokument-hinzufuegen">
                <span class="aktionssymbol" aria-hidden="true">↑</span>
                <span class="aktionstitel">Hochladen</span>
                <span class="aktionsbeschreibung">
                    Dokument auswählen
                </span>
            </a>

            <button class="aktion-einfuegen" type="button" disabled>
                <span class="aktionssymbol" aria-hidden="true">▤</span>
                <span class="aktionstitel">Einfügen</span>
                <span class="aktionsbeschreibung">
                    Dokument aus der Zwischenablage
                </span>
                <span class="aktionsstatus">Noch nicht verfügbar</span>
            </button>

            <a class="aktion-dokumente" href="/dokumente">
                <span class="aktionssymbol" aria-hidden="true">▱</span>
                <span class="aktionstitel">Meine Dokumente</span>
                <span class="aktionsbeschreibung">
                    Gespeicherte Unterlagen verwalten
                </span>
            </a>
        </nav>

        <section class="kategorienbereich">
            <h2>Kategorien</h2>

            <a class="kategorienlink" href="/kategorien">
                Kategorien verwalten
                <span aria-hidden="true"> →</span>
            </a>
        </section>
    </main>
</body>

</html>

name: Automatische Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: postgresql+psycopg://meinarchiv_test:nur-fuer-tests@127.0.0.1:5433/meinarchiv_test
      POSTGRES_PASSWORD: ci-placeholder
      OPENAI_API_KEY: ""

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: meinarchiv_test
          POSTGRES_USER: meinarchiv_test
          POSTGRES_PASSWORD: nur-fuer-tests
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U meinarchiv_test -d meinarchiv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v6

      - name: uv und Python einrichten
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.19"
          python-version: "3.13"

      - name: Python-Pakete installieren
        run: uv sync --locked

      - name: Tests ausführen
        run: uv run --locked pytest
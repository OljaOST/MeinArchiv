services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: meinarchiv
      POSTGRES_USER: meinarchiv
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Passwort in .env fehlt}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meinarchiv -d meinarchiv"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data: